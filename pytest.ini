[pytest]
testpaths = place_assistant/tests
pythonpath = .
addopts = -ra
markers =
    live: calls Vertex AI (Gemini, Maps and Search grounding). Small cost. Run with --live.
    billed: also calls the Maps Platform (Places, Geocoding), billed per place. Run with --billed.
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
